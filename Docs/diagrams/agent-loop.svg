<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ared" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">에이전트 루프 — AgentHarness.run(_:)</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">for step in 1...maxSteps { compactIfNeeded(); ① → ② → ③ → ④ }</text>

  <!-- User input -->
  <rect x="40" y="250" width="150" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">👤 사용자 질문</text>
  <text x="115" y="295" text-anchor="middle" font-size="12" fill="#1e40af">history.append(.user)</text>
  <line x1="190" y1="280" x2="255" y2="280" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <!-- ① Think -->
  <rect x="260" y="120" width="220" height="86" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="370" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">① 생각 🧠</text>
  <text x="370" y="168" text-anchor="middle" font-size="12" fill="#1f2937">model.next(system, history, tools)</text>
  <text x="370" y="186" text-anchor="middle" font-size="12" fill="#6b7280">→ ModelTurn(text, toolCalls, stop)</text>

  <!-- ② Decide -->
  <rect x="540" y="120" width="220" height="86" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="650" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">② 종료 판정</text>
  <text x="650" y="168" text-anchor="middle" font-size="12" fill="#1f2937">stop == .toolUse &amp;&amp; !toolCalls.isEmpty ?</text>
  <text x="650" y="186" text-anchor="middle" font-size="12" fill="#6b7280">아니오 → turn.text가 최종 답</text>
  <line x1="480" y1="163" x2="535" y2="163" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <!-- Final answer -->
  <rect x="790" y="128" width="140" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="860" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">✅ 최종 답변</text>
  <text x="860" y="178" text-anchor="middle" font-size="12" fill="#166534">return turn.text</text>
  <line x1="760" y1="163" x2="785" y2="163" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>

  <!-- ③ Act -->
  <rect x="540" y="330" width="220" height="110" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="650" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">③ 행동 🔧</text>
  <text x="650" y="378" text-anchor="middle" font-size="12" fill="#1f2937">permission(call) → .allow / .deny</text>
  <text x="650" y="396" text-anchor="middle" font-size="12" fill="#1f2937">route[call.name].callTool(…)  (MCP)</text>
  <text x="650" y="414" text-anchor="middle" font-size="12" fill="#6b7280">tools/call 요청 → 같은 id 응답</text>
  <text x="650" y="430" text-anchor="middle" font-size="11" fill="#dc2626">거부되면 서버까지 가지 않음</text>
  <line x1="650" y1="206" x2="650" y2="325" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text x="700" y="270" font-size="12" fill="#6b7280">예: 도구 요청 있음</text>

  <!-- ④ Observe -->
  <rect x="260" y="330" width="220" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="370" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">④ 관찰</text>
  <text x="370" y="378" text-anchor="middle" font-size="12" fill="#1f2937">history.append(.toolResult(</text>
  <text x="370" y="396" text-anchor="middle" font-size="12" fill="#1f2937">callID, content, isError))</text>
  <text x="370" y="418" text-anchor="middle" font-size="12" fill="#6b7280">실패도 '관찰'로 돌아간다 → 재시도 가능</text>
  <line x1="540" y1="385" x2="485" y2="385" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="330" x2="370" y2="211" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="270" font-size="12" fill="#6b7280">다음 바퀴</text>

  <!-- Permission hook side box -->
  <rect x="790" y="330" width="140" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="860" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">✋ 권한 훅</text>
  <text x="860" y="378" text-anchor="middle" font-size="11" fill="#1f2937">delete_* → 거부</text>
  <text x="860" y="396" text-anchor="middle" font-size="11" fill="#1f2937">add_fact → 사용자 승인</text>
  <text x="860" y="414" text-anchor="middle" font-size="11" fill="#1f2937">그 외 → 허용</text>
  <text x="860" y="432" text-anchor="middle" font-size="10" fill="#6b7280">async: 다이얼로그 대기 가능</text>
  <line x1="790" y1="378" x2="765" y2="378" stroke="#dc2626" stroke-width="2" marker-end="url(#ared)"/>

  <!-- Guards -->
  <rect x="40" y="470" width="890" height="64" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="494" font-size="13" fill="#1f2937"><tspan font-weight="700">안전장치</tspan>  maxSteps(기본 8): 바퀴 수 상한 → "⚠️ 최대 N단계에 도달"   ·   maxHistory(기본 40): 기록이 넘치면 user 메시지 경계에서만 잘라 도구 요청↔결과 짝을 보존</text>
  <text x="60" y="518" font-size="13" fill="#6b7280">화면 대응: 🧠 줄 = ①, 🔧 줄 = ③+④, 말풍선 = ②.  코드: Core/Harness.swift</text>
</svg>
