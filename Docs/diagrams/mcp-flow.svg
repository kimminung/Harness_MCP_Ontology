<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', Helvetica, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">MCP 메시지 흐름 — JSON-RPC 2.0, 무상태(2026-07-28)</text>

  <!-- lifelines -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="60" y="60" width="180" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="150" y="87" fill="#3730a3">AgentHarness + MCPClient</text>
    <rect x="390" y="60" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="480" y="87" fill="#374151">Transport (파이프)</text>
    <rect x="720" y="60" width="180" height="44" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="810" y="87" fill="#065f46">MCPServer + MCPTool</text>
  </g>
  <g stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 6">
    <line x1="150" y1="104" x2="150" y2="560"/>
    <line x1="480" y1="104" x2="480" y2="560"/>
    <line x1="810" y1="104" x2="810" y2="560"/>
  </g>

  <!-- 1 discover -->
  <text x="40" y="140" font-size="13" font-weight="700" fill="#1f2937">attach()</text>
  <line x1="150" y1="150" x2="805" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="480" y="143" text-anchor="middle" font-size="12" fill="#1e40af" font-family="Menlo, monospace">C→S {"id":1,"method":"server/discover","params":{"_meta":{…protocolVersion:"2026-07-28"}}}</text>
  <line x1="810" y1="180" x2="155" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
  <text x="480" y="173" text-anchor="middle" font-size="12" fill="#166534" font-family="Menlo, monospace">S→C {"id":1,"result":{"supportedVersions":[…],"_meta":{serverInfo:{name:"demo-server"}}}}</text>

  <!-- 2 tools/list -->
  <line x1="150" y1="220" x2="805" y2="220" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="480" y="213" text-anchor="middle" font-size="12" fill="#1e40af" font-family="Menlo, monospace">C→S {"id":2,"method":"tools/list","params":{"_meta":{…}}}</text>
  <line x1="810" y1="250" x2="155" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
  <text x="480" y="243" text-anchor="middle" font-size="12" fill="#166534" font-family="Menlo, monospace">S→C {"id":2,"result":{"tools":[{name, description, inputSchema}, …]}}</text>
  <rect x="40" y="262" width="330" height="40" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="205" y="279" text-anchor="middle" font-size="12" fill="#713f12">하네스: tools에 저장 + route[name] = client</text>
  <text x="205" y="295" text-anchor="middle" font-size="12" fill="#713f12">이 목록이 그대로 LLM에게 가는 "도구 설명서"</text>

  <!-- 3 tools/call -->
  <text x="40" y="340" font-size="13" font-weight="700" fill="#1f2937">run() ③ 행동</text>
  <rect x="40" y="350" width="220" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="150" y="373" text-anchor="middle" font-size="12" fill="#92400e">✋ permission(call) 먼저 — 거부면 여기서 끝</text>
  <line x1="150" y1="410" x2="805" y2="410" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="480" y="403" text-anchor="middle" font-size="12" fill="#1e40af" font-family="Menlo, monospace">C→S {"id":6,"method":"tools/call","params":{"name":"ontology_query","arguments":{…},"_meta":{…}}}</text>
  <rect x="690" y="420" width="240" height="56" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="810" y="440" text-anchor="middle" font-size="12" fill="#065f46">① _meta 버전 검사 (매 요청)</text>
  <text x="810" y="456" text-anchor="middle" font-size="12" fill="#065f46">② tools.first(name).run(arguments)</text>
  <text x="810" y="471" text-anchor="middle" font-size="11" fill="#6b7280">도구 실패 → isError:true (프로토콜 에러 아님)</text>
  <line x1="810" y1="500" x2="155" y2="500" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
  <text x="480" y="493" text-anchor="middle" font-size="12" fill="#166534" font-family="Menlo, monospace">S→C {"id":6,"result":{"content":[{"type":"text","text":"…"}],"isError":false,"resultType":"complete"}}</text>
  <rect x="40" y="512" width="330" height="40" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="205" y="529" text-anchor="middle" font-size="12" fill="#991b1b">MCPClient: waiting[id]를 깨움 (요청-응답 다중화)</text>
  <text x="205" y="545" text-anchor="middle" font-size="12" fill="#991b1b">하네스: history.append(.toolResult) → ④ 관찰</text>

  <!-- footer -->
  <rect x="40" y="570" width="890" height="40" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="480" y="595" text-anchor="middle" font-size="13" fill="#374151">같은 봉투라면 운반은 무엇이든 된다: InMemoryTransport(이 앱) · StdioTransport(한 줄 = JSON 하나) · HTTPTransport(요청마다 독립 POST).  코드: Core/MCP.swift</text>
</svg>
